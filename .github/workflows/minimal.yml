name: 2d action matrix

on: [push]

jobs:
  mjob:
    strategy:
      fail-fast: false
      matrix:
        float: [32, 64]
        msystem:
          - ucrt64
          - mingw32
          - mingw64
          - clang64
          - clangarm64
        include:
          # the extra 'msys' msystem runs once (only!), but without a 'float'
          - msystem: msys
          - msystem: clangarm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner || 'windows-latest' }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          release: true
          pacboy: >-
            toolchain:p
            base-devel:
      - name: Hello World
        run: |
          echo hello world
          echo "float  : ${{ matrix.float }}"
          echo "msystem: ${{ matrix.msystem }}"
          echo "runner : ${{ matrix.runner }}"
          uname -a || true
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Build
        run: |
          make || true
          file test*
          make check
