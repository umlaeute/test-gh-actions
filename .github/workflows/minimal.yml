name: 2d action matrix

on: [push]

jobs:
  mjob:
    strategy:
      matrix:
        float: [32, 64]
        # the extra 'clang64' msystem is executed, but without a 'runner'
        msystem: [mingw64, mingw32, clang64, clangarm64]
        include:
          # the extra 'ucrt64' msystem, but without a 'float'
          - msystem: ucrt64
            runner: windows-latest
          - msystem: mingw64
            runner: windows-latest
          - msystem: mingw32
            runner: windows-latest
          - msystem: clangarm64
            runner: windows-latest
    runs-on: ubuntu-latest
    steps:
      - name: hello
        run: |
          echo hello world
          echo "float  : ${{ matrix.float }}"
          echo "msystem: ${{ matrix.msystem }}"
          echo "runner : ${{ matrix.runner }}"
